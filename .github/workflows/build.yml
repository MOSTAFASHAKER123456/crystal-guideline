name: Crystal Guideline — Android Build

on:
  push:
    branches: [main, dev]
    paths:
      - 'jni/**'
      - 'smali/**'
      - 'patch.sh'
      - '.github/workflows/build.yml'

  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL of the base 8BP APK (optional, for full patch build)'
        required: false
        default: ''

env:
  NDK_VERSION: '26.3.11579264'
  CMAKE_VERSION: '3.22.1'
  BUILD_TYPE: Release
  ANDROID_API: '21'
  ABI: arm64-v8a

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Compile libcrystal_guideline.so
  # ─────────────────────────────────────────────

  build-native:
    name: Build Native (.so)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Android SDK
      # ─────────────────────────────────────────

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Long build number for cmdline-tools 12.0
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools'

      # ─────────────────────────────────────────
      # Accept licenses
      # ─────────────────────────────────────────

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      # ─────────────────────────────────────────
      # Install required Android packages
      # ─────────────────────────────────────────

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Install CMake
        run: |
          sdkmanager "cmake;${{ env.CMAKE_VERSION }}"

      # ─────────────────────────────────────────
      # Install Ninja
      # ─────────────────────────────────────────

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      # ─────────────────────────────────────────
      # Verify Android toolchain
      # ─────────────────────────────────────────

      - name: Verify Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "SDK packages:"
          sdkmanager --list_installed | head -100 || true

          echo "NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          echo "CMake:"
          ls -la "$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}"

          echo "CMake version:"
          cmake --version

          echo "Ninja version:"
          ninja --version

      # ─────────────────────────────────────────
      # Configure CMake
      # ─────────────────────────────────────────

      - name: Configure CMake
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          cmake \
            -S jni/ \
            -B .build/ \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DANDROID_STL=c++_static \
            -G Ninja

      # ─────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────

      - name: Build Native Library
        run: |
          cmake \
            --build .build/ \
            --config ${{ env.BUILD_TYPE }} \
            -j$(nproc)

      # ─────────────────────────────────────────
      # Verify output
      # ─────────────────────────────────────────

      - name: Verify .so
        run: |
          SO=".build/libcrystal_guideline.so"

          if [ ! -f "$SO" ]; then
            echo "ERROR: libcrystal_guideline.so was not generated."
            echo "Contents of .build:"
            find .build -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Generated library:"
          ls -lh "$SO"

          echo "File information:"
          file "$SO"

          file "$SO" | grep -q "ARM aarch64" \
            || (
              echo "ERROR: library is not ARM64/aarch64"
              exit 1
            )

      # ─────────────────────────────────────────
      # Upload native library
      # ─────────────────────────────────────────

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcrystal_guideline-arm64
          path: .build/libcrystal_guideline.so
          retention-days: 30


  # ─────────────────────────────────────────────
  # Job 2: Full APK patch
  # Runs only when apk_url is supplied manually
  # ─────────────────────────────────────────────

  patch-apk:
    name: Patch APK (optional)
    runs-on: ubuntu-latest
    needs: build-native

    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apk_url != '' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Java + APK tools
      # ─────────────────────────────────────────

      - name: Install APK build dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            openjdk-17-jdk \
            zipalign \
            apksigner \
            python3 \
            wget

      # ─────────────────────────────────────────
      # Install Apktool
      # ─────────────────────────────────────────

      - name: Install Apktool
        run: |
          wget -q \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar \
            -O /usr/local/bin/apktool.jar

          wget -q \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool

          chmod +x /usr/local/bin/apktool

          echo "Apktool installed:"
          apktool --version

      # ─────────────────────────────────────────
      # Download base APK
      # ─────────────────────────────────────────

      - name: Download base APK
        run: |
          if [ -z "${{ github.event.inputs.apk_url }}" ]; then
            echo "ERROR: apk_url was not provided."
            exit 1
          fi

          wget -q \
            "${{ github.event.inputs.apk_url }}" \
            -O base.apk

          if [ ! -s base.apk ]; then
            echo "ERROR: base.apk is empty or download failed."
            exit 1
          fi

          echo "Downloaded APK:"
          ls -lh base.apk

          file base.apk

      # ─────────────────────────────────────────
      # Download compiled native library
      # ─────────────────────────────────────────

      - name: Download compiled .so
        uses: actions/download-artifact@v4
        with:
          name: libcrystal_guideline-arm64
          path: dist/

      - name: Verify downloaded .so
        run: |
          if [ ! -f "dist/libcrystal_guideline.so" ]; then
            echo "ERROR: libcrystal_guideline.so not found."
            find dist -maxdepth 3 -type f -print
            exit 1
          fi

          ls -lh dist/libcrystal_guideline.so
          file dist/libcrystal_guideline.so

      # ─────────────────────────────────────────
      # Run patch script
      # ─────────────────────────────────────────

      - name: Run patch.sh
        run: |
          chmod +x patch.sh

          ./patch.sh base.apk

      # ─────────────────────────────────────────
      # Verify patched APK
      # ─────────────────────────────────────────

      - name: Verify patched APK
        run: |
          if [ ! -f "dist/crystal_patched_signed.apk" ]; then
            echo "ERROR: patched APK was not generated."
            echo "dist contents:"
            find dist -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Patched APK:"
          ls -lh dist/crystal_patched_signed.apk

          file dist/crystal_patched_signed.apk

      # ─────────────────────────────────────────
      # Upload patched APK
      # ─────────────────────────────────────────

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal_guideline_patched
          path: dist/crystal_patched_signed.apk
          retention-days: 14


  # ─────────────────────────────────────────────
  # Job 3: GitHub Release
  # ─────────────────────────────────────────────

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-native

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Download .so
        uses: actions/download-artifact@v4
        with:
          name: libcrystal_guideline-arm64
          path: release/

      - name: Verify release file
        run: |
          ls -lh release/libcrystal_guideline.so
          file release/libcrystal_guideline.so

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/libcrystal_guideline.so
          name: "Crystal Guideline ${{ github.ref_name }}"
          body: |
            ## Crystal Guideline ${{ github.ref_name }}

            ### Files

            - `libcrystal_guideline.so` — ARM64 native library

            ### Modes

            - Ghost Ball
            - Tangent Predictor
            - Line Extender
            - Wall bounce prediction
            - Up to 3 reflections